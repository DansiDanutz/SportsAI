name: P4.3 DigitalPerson Secret Bridge Capability
on:
  push:
    branches: [p4-digitalperson-secret-bridge]
    paths-ignore:
      - P4_DIGITALPERSON_SECRET_BRIDGE_CAPABILITY.json
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Record safe secret presence only
        shell: bash
        run: |
          openai=false
          vercel=false
          if [ -n "${OPENAI_API_KEY:-}" ]; then openai=true; fi
          if [ -n "${VERCEL_TOKEN:-}" ]; then vercel=true; fi
          node -e "const fs=require('fs');fs.writeFileSync('P4_DIGITALPERSON_SECRET_BRIDGE_CAPABILITY.json',JSON.stringify({openai_api_key_configured:process.argv[1]==='true',vercel_token_configured:process.argv[2]==='true',plaintext_exposed:false,checked_at:new Date().toISOString()},null,2)+'\n')" "$openai" "$vercel"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add P4_DIGITALPERSON_SECRET_BRIDGE_CAPABILITY.json
          git commit -m 'P4.3 record secret bridge capability only' || true
          git push
